services:
  postgres:
    image: postgres:16
    container_name: wynflex_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wynflex
      POSTGRES_USER: wynflex
      POSTGRES_PASSWORD: wynflex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
